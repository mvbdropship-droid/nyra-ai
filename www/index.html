<script>
(()=>{let API=localStorage.zuri_api_url||'https://nyra-api.itsprincemvb.workers.dev';const $=s=>document.querySelector(s);const sidebar=$('#sidebar'),hero=$('#hero'),chatview=$('#chatview'),mainbody=$('#mainbody'),prompt=$('#prompt'),tools=$('#tools'),modepill=$('#modepill'),modal=$('#modal'),modalbody=$('#modalbody'),orb=$('#orb');let modes=[],messages=[],threadId=null,recognition=null,listening=false,speaking=false,screenStream=null,attachedImage=null,attachedFile=null;
const icons={};function toast(t){let el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}function setTheme(){document.body.classList.toggle('light',localStorage.zuri_theme==='light')}setTheme();$('#theme').onclick=()=>{localStorage.zuri_theme=localStorage.zuri_theme==='light'?'dark':'light';setTheme()};$('#collapse').onclick=()=>sidebar.classList.toggle('collapsed');$('#hamb').onclick=()=>sidebar.classList.toggle('open');$('#profile').onclick=()=>accountModal();$('#orb').onclick=()=>stopSpeech();$('#plus').onclick=e=>{e.stopPropagation();tools.classList.toggle('open')};document.addEventListener('click',e=>{if(!tools.contains(e.target)&&e.target!==$('#plus'))tools.classList.remove('open')});
function newChat(){messages=[];threadId=null;mainbody.classList.remove('chat-active');attachedImage=null;attachedFile=null;chatview.innerHTML='';chatview.hidden=true;hero.hidden=false;renderModes();prompt.value='';sidebar.classList.remove('open');$('#history').innerHTML='';renderHistory()}function renderModes(){modepill.innerHTML=modes.map(m=>`<span class="pill">${m==='image'?'Image Generation':m==='video'?'Video Mode':'Deep Research'} <button data-remove="${m}" title="Cancel">×</button></span>`).join('');modepill.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{modes=modes.filter(x=>x!==b.dataset.remove);renderModes()})}function activateMode(m){if(!modes.includes(m))modes.push(m);renderModes();tools.classList.remove('open');toast(m==='image'?'Image mode activated':m==='video'?'Storyboard mode activated':'Research mode activated')}function openModal(html){modalbody.innerHTML=html;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)closeModal()};
function about(){openModal(`<button class="close" onclick="window.zuriClose()">×</button><h2>ZURI.AI</h2><p>Designed and engineered by <b>Soren.AI</b>, ZURI.AI is an AI assistant for conversation, creativity, IT learning and everyday exploration.</p><p><b>Capabilities</b><br>Chat & voice • Image concepts • Storyboards • Research assistance • IT and defensive security learning • Multilingual conversations • Screen mentoring with consent</p><p><b>Official Contact Phone</b><br>+234 (0) 800-SOREN-AI</p><p><b>Support Email</b><br>support@soren.ai</p><p><b>Social Media</b><br>X/Twitter • Instagram • YouTube • Discord • GitHub</p><button class="primary" onclick="window.zuriClose()">Close</button>`)}window.zuriClose=closeModal;
function accountModal(){openModal(`<button class="close" onclick="window.zuriClose()">×</button><h2>Sign in to ZURI.AI</h2><p>Save conversations and preferences on this device.</p><input id="uname" placeholder="Name"><input id="uemail" placeholder="Email or phone"><button class="primary" id="signin">Continue</button><p id="signinmsg"></p><p style="font-size:12px">This demo stores a local session on this browser. Production accounts require a secure server.</p>`);$('#signin').onclick=()=>{let n=$('#uname').value.trim(),e=$('#uemail').value.trim();if(!n||!e){$('#signinmsg').textContent='Please enter both fields.';return}let log=JSON.parse(localStorage.zuri_users_log||'[]');log.push({name:n,contact:e,at:new Date().toISOString()});localStorage.zuri_users_log=JSON.stringify(log);localStorage.zuri_session=JSON.stringify({name:n,contact:e});$('#signinmsg').textContent='Session saved locally. Welcome, '+n+'!';setTimeout(closeModal,900)}}
function showPanel(title,body){openModal(`<button class="close" onclick="window.zuriClose()">×</button><h2>${title}</h2>${body}<button class="primary" onclick="window.zuriClose()">Close</button>`)}function explore(){showPanel('Explore ZURI.AI',`<div class="exploregrid"><button class="tile" onclick="window.zuriExplore('IT & Defensive Cybersecurity Tutor')">⌘<b>IT & Defensive Cybersecurity Tutor</b><p>Learn systems, networking, security and safe practice.</p></button><button class="tile" onclick="window.zuriExplore('Live Screen Mentor')">▣<b>Live Screen Mentor</b><p>Guidance for a screen-sharing session you start.</p></button><button class="tile" onclick="window.zuriExplore('Project Coach')">✦<b>Project Coach</b><p>Plan and break projects into practical steps.</p></button><button class="tile" onclick="window.zuriExplore('Multilingual Translator')">文<b>Multilingual Translator</b><p>Translate and practice languages.</p></button></div>`)}window.zuriExplore=x=>{closeModal();prompt.value='Help me with '+x+': ';prompt.focus()};function library(){let a=JSON.parse(localStorage.zuri_library||'[]');showPanel('Library',a.length?`<div class="librarygrid">${a.map((x,i)=>`<div class="libitem">${x.url?`<img src="${x.url}" alt="Saved generation">`:''}<div style="font-size:12px;padding:7px">${x.label||'Saved item'}</div><button onclick="window.zuriDeleteLib(${i})">Remove</button></div>`).join('')}</div>`:'<p>Your saved images and files will appear here.</p>')}window.zuriDeleteLib=i=>{let a=JSON.parse(localStorage.zuri_library||'[]');a.splice(i,1);localStorage.zuri_library=JSON.stringify(a);library()};function saveLibrary(x){let a=JSON.parse(localStorage.zuri_library||'[]');a.unshift(x);localStorage.zuri_library=JSON.stringify(a)}
function renderHistory(){let t=JSON.parse(localStorage.zuri_threads||'[]');$('#history').innerHTML=t.slice(0,20).map((x,i)=>`<button data-thread="${i}" title="${esc(x.title)}">${esc(x.title||'Conversation')}</button>`).join('');$('#history').querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>loadThread(+b.dataset.thread))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveThread(){if(!messages.length)return;let ts=JSON.parse(localStorage.zuri_threads||'[]');let title=messages.find(x=>x.role==='user')?.content?.slice(0,55)||'Conversation';if(threadId===null){threadId=Date.now();ts.unshift({id:threadId,title,messages})}else{let i=ts.findIndex(x=>x.id===threadId);if(i>=0)ts[i].messages=messages;else ts.unshift({id:threadId,title,messages})}localStorage.zuri_threads=JSON.stringify(ts.slice(0,50));renderHistory()}function loadThread(i){let t=JSON.parse(localStorage.zuri_threads||'[]')[i];if(!t)return;messages=t.messages||[];threadId=t.id;mainbody.classList.add('chat-active');hero.hidden=true;chatview.hidden=false;chatview.innerHTML='';messages.forEach(renderMessage);sidebar.classList.remove('open')}
function startChat(){mainbody.classList.add('chat-active');hero.hidden=true;chatview.hidden=false}function renderMessage(m){let el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'ai');if(m.role==='assistant'){el.innerHTML=renderMarkdown(m.content)}else el.textContent=m.content;chatview.appendChild(el);el.querySelectorAll('.copycode').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.nextElementSibling.textContent).then(()=>toast('Copied code')));chatview.scrollTop=chatview.scrollHeight}function renderMarkdown(s){return esc(s).replace(/```([\w-]*)\n([\s\S]*?)```/g,(_,lang,code)=>`<div><button class="copycode">Copy</button><pre><code>${code}</code></pre></div>`).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function addMsg(role,content){messages.push({role,content});renderMessage({role,content});saveThread()}async function apiCall(msg,isVision=false,image=null){
 const payload={messages:messages.map(m=>({role:m.role==='assistant'?'assistant':m.role,content:m.content})),isVision,image};
 let lastErr;
 for(let attempt=0;attempt<2;attempt++){
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),45000);
  try{
   const r=await fetch(API,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload),signal:controller.signal});
   const raw=await r.text();clearTimeout(timeout);
   if(!r.ok)throw new Error('Server returned HTTP '+r.status+(raw?' — '+raw.slice(0,260):''));
   let data;try{data=JSON.parse(raw)}catch{if(raw.trim())return raw;throw new Error('The server returned an empty response.');}
   let answer=data.response??data.answer??data.reply??data.message??data.text??data.output??data.result??data.content;
   if(Array.isArray(data.choices)&&data.choices[0]?.message?.content)answer=data.choices[0].message.content;
   if(data.data&&typeof data.data==='object')answer=answer??data.data.response??data.data.answer??data.data.content;
   if(typeof answer==='object'&&answer!==null)answer=answer.content??JSON.stringify(answer);
   if(typeof answer==='string'&&answer.trim())return answer;
   if(data.error)throw new Error(typeof data.error==='string'?data.error:JSON.stringify(data.error));
   throw new Error('The API responded, but its JSON did not contain a reply. Expected response, answer, reply, message, text, output, result, content, or choices[0].message.content.');
  }catch(e){clearTimeout(timeout);lastErr=e;if(attempt===0)await new Promise(r=>setTimeout(r,600));}
 }
 if(lastErr?.name==='AbortError')throw new Error('The API timed out after 45 seconds. Check that the backend is running.');
 if(lastErr instanceof TypeError)throw new Error('Could not reach the API. This is usually a wrong endpoint, a server outage, or a CORS configuration problem. Open API Settings and verify the Worker URL.');
 throw lastErr||new Error('Request failed.');
}
function apiSettings(){openModal(`<button class="close" onclick="window.zuriClose()">×</button><h2>API Connection</h2><p>Connect ZURI to your deployed backend. Keep provider API keys on the server; never paste a secret key into this browser page.</p><label style="display:block;font-size:13px;margin-top:14px">Backend chat endpoint</label><input id="apiurl" type="url" value="${esc(API)}" placeholder="https://your-worker.workers.dev/chat"><p style="font-size:12px">The endpoint must accept POST JSON containing <code>messages</code>, <code>isVision</code> and <code>image</code>, allow browser CORS, and return JSON containing a reply field such as <code>response</code> or <code>answer</code>.</p><button class="primary" id="saveapi">Save endpoint</button> <button class="primary" id="testapi">Test connection</button><p id="apistatus" role="status"></p>`);$('#saveapi').onclick=()=>{let v=$('#apiurl').value.trim();try{let u=new URL(v);if(!['https:','http:'].includes(u.protocol))throw 0;API=u.href.replace(/\/$/,'');localStorage.zuri_api_url=API;$('#apistatus').textContent='Endpoint saved on this device.';}catch{$('#apistatus').textContent='Enter a valid http(s) URL.'}};$('#testapi').onclick=async()=>{let v=$('#apiurl').value.trim();try{new URL(v);API=v.replace(/\/$/,'');localStorage.zuri_api_url=API;$('#apistatus').textContent='Sending a test message…';let old=messages;messages=[{role:'user',content:'Reply with exactly: ZURI connection test successful.'}];let a=await apiCall('connection test');messages=old;$('#apistatus').textContent='Connected. Server replied: '+a.slice(0,180)}catch(e){$('#apistatus').textContent='Connection failed: '+e.message}}}

async function send(){let text=prompt.value.trim();if(!text&&!attachedImage&&!attachedFile)return;let mode=modes[0];if(mode==='image'){prompt.value='';await generateImage(text||'A cinematic futuristic silver Z symbol');return}if(mode==='video'){text='Create a cinematic video concept and storyboard for: '+text}if(mode==='research'){text='Conduct structured multi-angle research, separate established facts from uncertainty, and summarize sources or verification suggestions for: '+text}if(attachedFile){text+='\n\nAttached file content:\n'+attachedFile;attachedFile=null}if(attachedImage){text+='\n\n[Image attached for visual analysis]';let img=attachedImage;attachedImage=null;addMsg('user',text);prompt.value='';startChat();let thinking=document.createElement('div');thinking.className='msg ai typing';thinking.textContent='ZURI is thinking…';chatview.appendChild(thinking);try{let answer=await apiCall(text,true,img);thinking.remove();addMsg('assistant',answer);speakMaybe(answer)}catch(e){thinking.textContent='ZURI could not connect: '+(e?.message||'unknown error')+'\nCheck endpoint, CORS, and server response.'}return}prompt.value='';startChat();addMsg('user',text);let thinking=document.createElement('div');thinking.className='msg ai typing';thinking.textContent='ZURI is thinking…';chatview.appendChild(thinking);try{let answer=await apiCall(text);thinking.remove();addMsg('assistant',answer);speakMaybe(answer)}catch(e){thinking.textContent='I could not get a reply from the AI server.\n'+(e?.message||'Unknown connection error')+'\n\nOpen API Settings from the sidebar to verify the backend endpoint.';let retry=document.createElement('button');retry.className='primary';retry.textContent='API Settings';retry.onclick=apiSettings;thinking.appendChild(document.createElement('br'));thinking.appendChild(retry);toast('AI server connection failed')}}$('#send').onclick=send;prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function generateImage(p){if(!p){toast('Describe the image first');prompt.focus();return}startChat();addMsg('user','Generate image: '+p);let el=document.createElement('div');el.className='msg ai typing';el.textContent='Creating image…';chatview.appendChild(el);try{let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width=1024&height=1024&model=flux&nologo=true&seed='+Math.floor(Math.random()*1000000);let im=new Image();im.src=url;im.alt=p;im.onload=()=>{el.className='msg ai';el.innerHTML=`<p>Generated image</p><img src="${url}" alt="${esc(p)}"><p><a href="${url}" download="zuri-image.png" style="color:inherit">Download HD</a> · <button id="saveimg">Save to Library</button></p>`;$('#saveimg').onclick=()=>{saveLibrary({url,label:p});toast('Saved to Library')}};im.onerror=()=>{el.textContent='Image generation failed. Try another prompt.'};}catch(e){el.textContent='Generation failed.'}}
$('#tools').querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tools.classList.remove('open');let x=b.dataset.tool;if(x==='chat'){modes=[];renderModes();if(!messages.length){chatview.innerHTML=''}startChat();tools.classList.remove('open');prompt.focus();}else if(x==='image'||x==='video'||x==='research')activateMode(x);else if(x==='voice')voiceStart();else if(x==='imageupload')$('#imgfile').click();else if(x==='fileupload')$('#codefile').click();else if(x==='screen')watchScreen()});$('#imgfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;attachedImage=await fileData(f);prompt.placeholder='Ask about the image…';toast('Image attached')};$('#codefile').onchange=async e=>{let f=e.target.files[0];if(!f)return;attachedFile=await f.text();prompt.placeholder='Ask about the attached file…';toast('File attached: '+f.name)};function fileData(f){return new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
function voiceStart(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Speech recognition is not supported in this browser');return}stopSpeech();recognition=new SR();recognition.lang='';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{listening=true;orb.style.filter='brightness(1.7)';toast('Listening — speak now')};recognition.onresult=e=>{prompt.value=e.results[0][0].transcript;send()};recognition.onerror=()=>toast('Voice input stopped');recognition.onend=()=>{listening=false;orb.style.filter='';};recognition.start()}function stopSpeech(){if(window.speechSynthesis)speechSynthesis.cancel();speaking=false;if(recognition){try{recognition.stop()}catch{}recognition=null}listening=false;orb.style.filter=''}function speakMaybe(text){if(!window.speechSynthesis)return;let clean=text.replace(/```[\s\S]*?```/g,' code omitted ').replace(/<[^>]*>/g,'');let u=new SpeechSynthesisUtterance(clean);u.onstart=()=>speaking=true;u.onend=()=>speaking=false;speechSynthesis.speak(u)}
async function watchScreen(){if(!navigator.mediaDevices?.getDisplayMedia){toast('Screen capture is unavailable on this browser');return}try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});showPanel('Screen mentor session',`<p>Screen sharing is active. Stop sharing from the browser's capture controls when finished.</p><div class="screenpreview"><video id="screenvideo" autoplay muted></video></div><textarea id="screenquestion" placeholder="What would you like ZURI to help you understand on screen?"></textarea><button class="primary" id="screenask">Ask about my screen</button>`);$('#screenvideo').srcObject=screenStream;$('#screenask').onclick=async()=>{let q=$('#screenquestion').value;closeModal();toast('Screen mentor is a prototype; visual frame forwarding is not configured in this demo.')};screenStream.getVideoTracks()[0].onended=()=>{screenStream=null;toast('Screen sharing ended')}}catch(e){toast('Screen share cancelled')}}
sidebar.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;sidebar.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(a==='new')newChat();if(a==='past')$('#history').style.display=$('#history').style.display==='block'?'none':'block';if(a==='library')library();if(a==='explore')explore();if(a==='about')about();if(a==='api')apiSettings();if(a==='pro')showPanel('ZURI.AI Pro',`<p>Pro plans and billing are not connected in this prototype.</p><p>Production subscription checkout should be implemented through a trusted payment provider.</p>`)});$('#history').style.display='none';renderHistory();window.zuriApiSettings=apiSettings;
})();
</script></body></html>
